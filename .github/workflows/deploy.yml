name: Deploy site

# Runs every time you save a change on github.com (or push from your computer).
# If a typo breaks the settings or items, the check step fails and the live site
# keeps showing the last good version. Look for the red X on the Actions tab.
# If a run shows a red X on "deploy" with an "artifact" message, click "Re-run all jobs".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check settings and items for mistakes
        run: node tools/check.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
